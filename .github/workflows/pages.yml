name: Course site

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "pixi.toml"
      - "course/**"
      - "course-utils/src/fysisk_biokemi/datasets/**"
      - "fonts/**"
  workflow_dispatch:
    inputs:
      refresh-freeze:
        description: "Refresh Quarto freeze state instead of restoring the cached freeze directory"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.66.0
          cache: true

      - name: Restore Quarto freeze cache
        id: freeze-cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs['refresh-freeze']) }}
        uses: actions/cache/restore@v4
        with:
          path: course/_freeze
          key: quarto-freeze-${{ runner.os }}-${{ hashFiles('course/**/*.qmd', 'course/_quarto*.yml', 'course/_extensions/**', 'course-utils/**', 'pixi.toml', 'pixi.lock', 'uv.lock') }}
          restore-keys: |
            quarto-freeze-${{ runner.os }}-

      - name: Clear Quarto freeze cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs['refresh-freeze'] }}
        run: pixi run clear-freeze

      - name: Render course site
        id: render-course
        run: pixi run render-all

      - name: Check rendered outputs
        run: pixi run prepare-site-artifact

      - name: Stage notebooks
        run: pixi run stage-notebooks

      - name: Save Quarto freeze cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs['refresh-freeze']) && steps.freeze-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: course/_freeze
          key: quarto-freeze-${{ runner.os }}-${{ hashFiles('course/**/*.qmd', 'course/_quarto*.yml', 'course/_extensions/**', 'course-utils/**', 'pixi.toml', 'pixi.lock', 'uv.lock') }}

      - name: Save refreshed Quarto freeze cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs['refresh-freeze'] }}
        uses: actions/cache/save@v4
        with:
          path: course/_freeze
          key: quarto-freeze-${{ runner.os }}-${{ hashFiles('course/**/*.qmd', 'course/_quarto*.yml', 'course/_extensions/**', 'course-utils/**', 'pixi.toml', 'pixi.lock', 'uv.lock') }}-${{ github.run_id }}

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: course-site
          path: course/_site-combined
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload staged notebooks
        uses: actions/upload-artifact@v4
        with:
          name: course-notebooks
          path: build/notebooks
          if-no-files-found: error

  publish-site:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .branch-check/gh-pages

      - name: Download rendered site
        uses: actions/download-artifact@v4
        with:
          name: course-site
          path: site

      - name: Publish site to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: true
          clean-exclude: |
            wheels
            wheels/**
            CNAME
          commit-message: Update course site

  publish-notebooks:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require built-notebooks branch
        uses: actions/checkout@v4
        with:
          ref: built-notebooks
          path: .branch-check/built-notebooks

      - name: Download staged notebooks
        uses: actions/download-artifact@v4
        with:
          name: course-notebooks
          path: notebooks

      - name: Publish notebooks to built-notebooks
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: built-notebooks
          folder: notebooks
          target-folder: built_notebooks
          clean: true
          commit-message: Update notebooks

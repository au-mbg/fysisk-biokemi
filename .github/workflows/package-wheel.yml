name: Package wheel

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/package-wheel.yml"
      - "pixi.toml"
      - "course-utils/**"
      - "uv.lock"
      - "pixi.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.66.0
          cache: true

      - name: Build wheel
        run: pixi run build-wheel

      - name: Check wheel
        run: pixi run check-wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: package-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish-wheel:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .branch-check/gh-pages

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: package-wheel
          path: wheel-dist

      - name: Publish wheel to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: wheel-dist
          target-folder: wheels
          clean: true
          commit-message: Update package wheel
